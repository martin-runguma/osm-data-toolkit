<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470"><rect width="1000" height="470" fill="#F9FBFC"/><text x="38" y="49" font-family="Segoe UI,Arial" font-size="13" letter-spacing="2" font-weight="700" fill="#1769AA">THE DOWNLOAD WORKFLOW</text><text x="38" y="82" font-family="Segoe UI,Arial" font-size="24" font-weight="650" fill="#1B2C3B">From selected area to organised QGIS layers</text><g font-family="Segoe UI,Arial"><g transform="translate(38 130)"><rect width="206" height="250" rx="8" fill="#fff" stroke="#DDE7ED"/><circle cx="29" cy="30" r="16" fill="#EAF3FB"/><text x="29" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1769AA">1</text><rect x="22" y="69" width="162" height="94" rx="5" fill="#EEF4F6"/><path d="M25 112h155M70 74v85M130 74v85" stroke="#D4E0E7" stroke-width="7"/><rect x="72" y="91" width="70" height="48" fill="#DDECF6" stroke="#1769AA" stroke-width="3" stroke-dasharray="5 4"/><text x="22" y="198" font-size="16" font-weight="700" fill="#263B4B">Define AOI</text><text x="22" y="220" font-size="11" fill="#687987">Choose a map extent</text><text x="22" y="237" font-size="11" fill="#687987">or draw a rectangle.</text></g><path d="M250 255h28m-8-8 8 8-8 8" stroke="#8FA9BA" stroke-width="3" fill="none"/><g transform="translate(285 130)"><rect width="206" height="250" rx="8" fill="#fff" stroke="#DDE7ED"/><circle cx="29" cy="30" r="16" fill="#EAF3FB"/><text x="29" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1769AA">2</text><g fill="#DDECF6"><rect x="23" y="72" width="70" height="35" rx="4"/><rect x="108" y="72" width="74" height="35" rx="4"/><rect x="23" y="119" width="70" height="35" rx="4"/><rect x="108" y="119" width="74" height="35" rx="4"/></g><g fill="#1769AA" font-size="10" font-weight="700"><text x="58" y="94" text-anchor="middle">Roads</text><text x="145" y="94" text-anchor="middle">POI</text><text x="58" y="141" text-anchor="middle">Buildings</text><text x="145" y="141" text-anchor="middle">Water</text></g><text x="22" y="198" font-size="16" font-weight="700" fill="#263B4B">Select categories</text><text x="22" y="220" font-size="11" fill="#687987">Tick only the features</text><text x="22" y="237" font-size="11" fill="#687987">needed for the task.</text></g><path d="M497 255h28m-8-8 8 8-8 8" stroke="#8FA9BA" stroke-width="3" fill="none"/><g transform="translate(532 130)"><rect width="206" height="250" rx="8" fill="#fff" stroke="#DDE7ED"/><circle cx="29" cy="30" r="16" fill="#EAF3FB"/><text x="29" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1769AA">3</text><rect x="24" y="74" width="158" height="36" rx="4" fill="#F2F6F8" stroke="#E1E8ED"/><rect x="35" y="85" width="13" height="13" rx="2" fill="#1769AA"/><text x="59" y="96" font-size="11" fill="#526778">GeoPackage</text><rect x="24" y="120" width="158" height="36" rx="4" fill="#F2F6F8" stroke="#E1E8ED"/><rect x="35" y="131" width="13" height="13" rx="2" fill="#fff" stroke="#A7BAC8"/><text x="59" y="142" font-size="11" fill="#526778">Shapefile</text><text x="22" y="198" font-size="16" font-weight="700" fill="#263B4B">Configure output</text><text x="22" y="220" font-size="11" fill="#687987">Choose a format, folder</text><text x="22" y="237" font-size="11" fill="#687987">and processing options.</text></g><path d="M744 255h28m-8-8 8 8-8 8" stroke="#8FA9BA" stroke-width="3" fill="none"/><g transform="translate(779 130)"><rect width="183" height="250" rx="8" fill="#fff" stroke="#DDE7ED"/><circle cx="29" cy="30" r="16" fill="#EAF3FB"/><text x="29" y="35" text-anchor="middle" font-size="12" font-weight="700" fill="#1769AA">4</text><rect x="24" y="74" width="135" height="86" rx="5" fill="#EEF4F6"/><path d="M46 118h92" stroke="#69B8E8" stroke-width="6" stroke-linecap="round"/><circle cx="54" cy="118" r="9" fill="#1769AA"/><circle cx="130" cy="118" r="9" fill="#1769AA"/><text x="22" y="198" font-size="16" font-weight="700" fill="#263B4B">Download &amp; load</text><text x="22" y="220" font-size="11" fill="#687987">Process OSM features</text><text x="22" y="237" font-size="11" fill="#687987">and add output to QGIS.</text></g></g></svg>