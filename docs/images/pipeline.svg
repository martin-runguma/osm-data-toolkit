<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="How the plugin processes a download" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
<title>How the plugin processes a download</title>
<rect width="900" height="210" rx="14" fill="#F3F7FA" stroke="#DCE6EC"/><rect x="20" y="38" width="148" height="120" rx="12" fill="#fff" stroke="#0A97D9" stroke-width="2"/><rect x="21" y="39" width="146" height="6" rx="3" fill="#0A97D9"/><text x="94.0" y="82" font-size="15" font-weight="700" fill="#0F2A3D" text-anchor="middle">Overpass API</text><text x="94.0" y="106" font-size="12.5" fill="#6B8090" text-anchor="middle">OSM data for your</text><text x="94.0" y="124" font-size="12.5" fill="#6B8090" text-anchor="middle">area</text><path d="M172,98 h18 m-7,-7 l7,7 l-7,7" fill="none" stroke="#6B8090" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="198" y="38" width="148" height="120" rx="12" fill="#fff" stroke="#43A047" stroke-width="2"/><rect x="199" y="39" width="146" height="6" rx="3" fill="#43A047"/><text x="272.0" y="82" font-size="15" font-weight="700" fill="#0F2A3D" text-anchor="middle">Classify</text><text x="272.0" y="106" font-size="12.5" fill="#6B8090" text-anchor="middle">match tags to your</text><text x="272.0" y="124" font-size="12.5" fill="#6B8090" text-anchor="middle">categories</text><path d="M350,98 h18 m-7,-7 l7,7 l-7,7" fill="none" stroke="#6B8090" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="376" y="38" width="148" height="120" rx="12" fill="#fff" stroke="#8E5BD0" stroke-width="2"/><rect x="377" y="39" width="146" height="6" rx="3" fill="#8E5BD0"/><text x="450.0" y="82" font-size="15" font-weight="700" fill="#0F2A3D" text-anchor="middle">Build geometry</text><text x="450.0" y="106" font-size="12.5" fill="#6B8090" text-anchor="middle">points, lines,</text><text x="450.0" y="124" font-size="12.5" fill="#6B8090" text-anchor="middle">polygons; relations</text><text x="450.0" y="142" font-size="12.5" fill="#6B8090" text-anchor="middle">assembled</text><path d="M528,98 h18 m-7,-7 l7,7 l-7,7" fill="none" stroke="#6B8090" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="554" y="38" width="148" height="120" rx="12" fill="#fff" stroke="#0F2A3D" stroke-width="2"/><rect x="555" y="39" width="146" height="6" rx="3" fill="#0F2A3D"/><text x="628.0" y="82" font-size="15" font-weight="700" fill="#0F2A3D" text-anchor="middle">Staging file</text><text x="628.0" y="106" font-size="12.5" fill="#6B8090" text-anchor="middle">temporary</text><text x="628.0" y="124" font-size="12.5" fill="#6B8090" text-anchor="middle">GeoPackage, one</text><text x="628.0" y="142" font-size="12.5" fill="#6B8090" text-anchor="middle">layer per category</text><path d="M706,98 h18 m-7,-7 l7,7 l-7,7" fill="none" stroke="#6B8090" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="732" y="38" width="148" height="120" rx="12" fill="#fff" stroke="#E53935" stroke-width="2"/><rect x="733" y="39" width="146" height="6" rx="3" fill="#E53935"/><text x="806.0" y="82" font-size="15" font-weight="700" fill="#0F2A3D" text-anchor="middle">Your output</text><text x="806.0" y="106" font-size="12.5" fill="#6B8090" text-anchor="middle">GeoPackage or</text><text x="806.0" y="124" font-size="12.5" fill="#6B8090" text-anchor="middle">Shapefile</text><text x="450" y="188" font-size="13" fill="#6B8090" text-anchor="middle">The download runs in a background thread, so QGIS stays responsive.</text>
</svg>
