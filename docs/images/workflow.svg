<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Workflow: define area, choose categories, download, get layers" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
<title>Workflow: define area, choose categories, download, get layers</title>
<rect width="900" height="250" rx="14" fill="#F3F7FA" stroke="#DCE6EC"/><rect x="24" y="34" width="186" height="182" rx="12" fill="#fff" stroke="#DCE6EC"/><circle cx="52" cy="66" r="15" fill="#0A97D9"/><text x="52" y="72" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="74" y="72" font-size="15.5" font-weight="700" fill="#0F2A3D">Define the area</text><text x="40" y="110" font-size="13.5" fill="#6B8090">Draw a rectangle, use</text><text x="40" y="131" font-size="13.5" fill="#6B8090">the map extent,</text><text x="40" y="152" font-size="13.5" fill="#6B8090">selected features or a</text><text x="40" y="173" font-size="13.5" fill="#6B8090">layer extent</text><path d="M215,125 h24 m-8,-8 l8,8 l-8,8" fill="none" stroke="#0A97D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="246" y="34" width="186" height="182" rx="12" fill="#fff" stroke="#DCE6EC"/><circle cx="274" cy="66" r="15" fill="#0A97D9"/><text x="274" y="72" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="296" y="72" font-size="15.5" font-weight="700" fill="#0F2A3D">Pick categories</text><text x="262" y="110" font-size="13.5" fill="#6B8090">POI, stops, roads,</text><text x="262" y="131" font-size="13.5" fill="#6B8090">buildings, boundaries,</text><text x="262" y="152" font-size="13.5" fill="#6B8090">landuse and more</text><path d="M437,125 h24 m-8,-8 l8,8 l-8,8" fill="none" stroke="#0A97D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="468" y="34" width="186" height="182" rx="12" fill="#fff" stroke="#DCE6EC"/><circle cx="496" cy="66" r="15" fill="#0A97D9"/><text x="496" y="72" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="518" y="72" font-size="15.5" font-weight="700" fill="#0F2A3D">Download</text><text x="484" y="110" font-size="13.5" fill="#6B8090">Queries the Overpass</text><text x="484" y="131" font-size="13.5" fill="#6B8090">API, with an optional</text><text x="484" y="152" font-size="13.5" fill="#6B8090">local cache</text><path d="M659,125 h24 m-8,-8 l8,8 l-8,8" fill="none" stroke="#0A97D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="690" y="34" width="186" height="182" rx="12" fill="#fff" stroke="#DCE6EC"/><circle cx="718" cy="66" r="15" fill="#0A97D9"/><text x="718" y="72" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="740" y="72" font-size="15.5" font-weight="700" fill="#0F2A3D">Get your layers</text><text x="706" y="110" font-size="13.5" fill="#6B8090">GeoPackage or</text><text x="706" y="131" font-size="13.5" fill="#6B8090">Shapefile, added</text><text x="706" y="152" font-size="13.5" fill="#6B8090">straight to QGIS</text>
</svg>
