<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="GeoPackage and Shapefile output compared" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
<title>GeoPackage and Shapefile output compared</title>
